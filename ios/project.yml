name: Tekyida
options:
  bundleIdPrefix: com.tekyida
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    PRODUCT_NAME: Tekyida
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: Sources/App/Info.plist

targets:
  Tekyida:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekyida.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_BITCODE: NO

  TekyidaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TekyidaTests
    dependencies:
      - target: Tekyida
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekyida.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

  TekyidaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/TekyidaUITests
    dependencies:
      - target: Tekyida
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekyida.uitests
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  Tekyida:
    build:
      targets:
        Tekyida: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TekyidaTests
        - TekyidaUITests
    profile:
      config: Release
    archive:
      config: Release
