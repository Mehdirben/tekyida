name: Tekyida
options:
  bundleIdPrefix: com.tekyida
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    PRODUCT_NAME: Tekyida
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: false
    INFOPLIST_FILE: Sources/App/Info.plist

targets:
  Tekyida:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tekyida.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_BITCODE: NO
