name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Cancel in-progress runs on the same branch to conserve macOS minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality Gate & Change Detection (Strict Quality Check)
  # -------------------------------------------------------------
  quality-gate:
    name: Quality Gate & Change Detection
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true' }}
      mobile: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' || steps.filter.outputs.ios == 'true' || steps.filter.outputs.distribution == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package*.json'
            frontend:
              - 'frontend/**'
              - 'package*.json'
            android:
              - 'android/**'
              - 'distribution/**'
              - 'package*.json'
            ios:
              - 'ios/**'
              - 'distribution/**'
              - 'package*.json'
            distribution:
              - 'distribution/**'

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup npm cache for quality checks
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: qg-npm-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}

      - name: Install Quality Gate Dependencies
        run: |
          [ "${{ steps.filter.outputs.backend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && npm ci --prefix backend --prefer-offline || true
          [ "${{ steps.filter.outputs.frontend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && npm ci --prefix frontend --prefer-offline || true

      - name: Run Tekyida Quality Gate (tests/run.sh)
        env:
          CHANGE_BACKEND: ${{ steps.filter.outputs.backend }}
          CHANGE_FRONTEND: ${{ steps.filter.outputs.frontend }}
          CHANGE_ANDROID: ${{ steps.filter.outputs.android }}
          CHANGE_IOS: ${{ steps.filter.outputs.ios }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x tests/run.sh
          ./tests/run.sh

  # -------------------------------------------------------------
  # Job 2: Initialize GitHub Release (Asset Carry-Forward)
  # -------------------------------------------------------------
  init-release:
    name: Initialize Release & Carry Forward Assets
    needs: [ quality-gate ]
    if: github.event_name != 'pull_request' && needs.quality-gate.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "build-${{ github.run_number }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release build-${{ github.run_number }} already exists."
          else
            gh release create "build-${{ github.run_number }}" \
              --repo "${{ github.repository }}" \
              --title "Build ${{ github.run_number }}" \
              --generate-notes
          fi

          # Carry forward previous release assets so both APK and IPA are guaranteed in every release
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" --limit 2 --json tagName -q '.[].tagName' 2>/dev/null | grep -v "build-${{ github.run_number }}" | head -n 1 || true)
          if [ -n "$LATEST_TAG" ]; then
            echo "Carrying forward assets from previous release: $LATEST_TAG"
            mkdir -p previous-assets
            gh release download "$LATEST_TAG" --repo "${{ github.repository }}" --pattern "Tekyida.*" --pattern "apps.json" --dir previous-assets || true
            if ls previous-assets/* >/dev/null 2>&1; then
              gh release upload "build-${{ github.run_number }}" \
                --repo "${{ github.repository }}" \
                previous-assets/* \
                --clobber || true
            fi
          fi

  # -------------------------------------------------------------
  # Job 3: iOS Build (SwiftUI, XcodeGen, Unsigned IPA)
  # -------------------------------------------------------------
  build-ios:
    name: Build & Package iOS IPA
    needs: [ quality-gate, init-release ]
    if: |
      always() &&
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.ios == 'true' &&
      (needs.init-release.result == 'success' || needs.init-release.result == 'skipped')
    runs-on: macos-15

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Stamps the CI run number into CFBundleVersion so each build shows a
      # distinct version inside LiveContainer (easy to confirm an update landed)
      - name: Stamp Build Number
        run: plutil -replace CFBundleVersion -string "${{ github.run_number }}" Sources/App/Info.plist

      # Purely informational: logs which Xcode version compiled the app
      - name: Show Xcode Version
        run: xcodebuild -version

      # Caches Homebrew downloads to avoid re-downloading bottles on macOS
      - name: Cache Homebrew Downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-xcodegen-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-

      # Installs XcodeGen, which converts project.yml into a real .xcodeproj file.
      - name: Install XcodeGen
        run: brew install xcodegen

      # Generates Tekyida.xcodeproj from project.yml.
      - name: Generate Xcode Project
        run: xcodegen generate

      # Caches Xcode DerivedData for faster simulator test & build times
      - name: Cache Xcode DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('ios/project.yml', 'ios/Sources/**', 'ios/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      # Runs iOS Unit Tests and UI E2E Tests in Simulator
      - name: Run iOS Unit & UI E2E Tests (Simulator)
        run: |
          xcodebuild test \
            -project Tekyida.xcodeproj \
            -scheme Tekyida \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Compiles the app into an .xcarchive without code signing.
      # The resulting binary is unsigned and requires LiveContainer or a sideloading tool
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Tekyida.xcodeproj \
            -scheme Tekyida \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tekyida.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Creates the unsigned .ipa file by packaging the compiled .app into Payload/
      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Tekyida.xcarchive/Products/Applications/Tekyida.app build/Payload/
          cd build && zip -r Tekyida.ipa Payload

      # Generates apps.json -- the source feed that LiveContainer reads to detect updates.
      - name: Generate LiveContainer Source JSON
        run: |
          cat <<EOF > build/apps.json
          {
            "name": "Tekyida LiveContainer Source",
            "identifier": "com.tekyida.ios.source",
            "apps": [
              {
                "bundleIdentifier": "com.tekyida.app",
                "name": "Tekyida",
                "developerName": "Tekyida",
                "localizedDescription": "Modern IOU Tracker for iOS & Android",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/ios/Sources/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                "versions": [
                  {
                    "version": "1.0",
                    "buildVersion": "${{ github.run_number }}",
                    "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "minOSVersion": "17.0",
                    "localizedDescription": "Automated build from commit ${{ github.sha }}",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/Tekyida.ipa",
                    "size": $(stat -f%z build/Tekyida.ipa)
                  }
                ]
              }
            ]
          }
          EOF

      # Directly uploads IPA and apps.json to GitHub Release (No actions storage used)
      - name: Upload iOS Assets Directly to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "build-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            build/Tekyida.ipa \
            build/apps.json \
            --clobber

  # -------------------------------------------------------------
  # Job 4: Android Build (Kotlin, Jetpack Compose, Release APK)
  # -------------------------------------------------------------
  build-android:
    name: Build & Package Android APK
    needs: [ quality-gate, init-release ]
    if: |
      always() &&
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.android == 'true' &&
      (needs.init-release.result == 'success' || needs.init-release.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Sets up Java JDK 17 for Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Sets up Gradle with caching for fast incremental builds
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      # Runs Android Unit & Security Tests
      - name: Run Android Unit & Security Tests
        run: ./gradlew testReleaseUnitTest --no-daemon

      # Builds the release APK with dynamic versionCode matching CI
      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon -x lint

      # Renames to Tekyida.apk for standard naming
      - name: Prepare APK Asset
        run: |
          mkdir -p build-assets
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-assets/Tekyida.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk build-assets/Tekyida.apk

      # Directly uploads APK to GitHub Release (No actions storage used)
      - name: Upload Android Assets Directly to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "build-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            build-assets/Tekyida.apk \
            --clobber

  # -------------------------------------------------------------
  # Job 5: Web Build, E2E & DAST Dynamic Security Verification
  # -------------------------------------------------------------
  build-web:
    name: Build & Verify Web (E2E & DAST)
    needs: [ quality-gate ]
    if: |
      always() &&
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js runtime for web
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Web npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: web-npm-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}

      - name: Install Web Packages
        run: |
          npm ci --prefix backend --prefer-offline
          npm ci --prefix frontend --prefer-offline

      - name: Cache Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json', 'frontend/app/**', 'frontend/components/**', 'frontend/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npx --prefix frontend playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          npx --prefix frontend playwright install-deps chromium

      - name: Build Next.js Production Web App
        env:
          NEXT_PUBLIC_CONVEX_URL: https://tekyida-convex-api.codecy.dev
          NEXT_PUBLIC_CONVEX_SITE_URL: https://tekyida-convex-site.codecy.dev
        run: |
          npm run build --prefix frontend

      - name: Run Web E2E & DAST Security Suite
        env:
          NEXT_PUBLIC_CONVEX_URL: https://tekyida-convex-api.codecy.dev
          NEXT_PUBLIC_CONVEX_SITE_URL: https://tekyida-convex-site.codecy.dev
        run: |
          npm run test:e2e --prefix frontend

  # -------------------------------------------------------------
  # Job 6: Deploy Mobile Distribution Portal & Repositories (GitHub Pages)
  # -------------------------------------------------------------
  deploy-distribution:
    name: Deploy Mobile Distribution (SideStore & F-Droid)
    needs: [ quality-gate, init-release, build-ios, build-android ]
    if: |
      always() &&
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.mobile == 'true' &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Sets up Java JDK 17 for keytool and F-Droid index signing
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Installs F-Droid server via pipx for accurate Android resources parsing
      - name: Install F-Droid Server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apksigner pipx
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fetches latest release assets (APK, IPA, apps.json)
      - name: Download Mobile Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "build-${{ github.run_number }}" \
            --repo "${{ github.repository }}" \
            --pattern "Tekyida.*" \
            --pattern "apps.json" \
            --dir release-assets || true

      # Builds the static GitHub Pages distribution site
      - name: Assemble Mobile Distribution Site
        run: |
          mkdir -p site-pages/ios site-pages/fdroid/repo site-pages/fdroid/metadata
          cp distribution/portal/index.html site-pages/index.html
          cp distribution/fdroid/icon.png site-pages/fdroid/icon.png

          # 1. Setup iOS SideStore source feed
          if [ -f release-assets/apps.json ]; then
            cp release-assets/apps.json site-pages/ios/apps.json
          else
            cat <<EOF > site-pages/ios/apps.json
            {
              "name": "Tekyida LiveContainer Source",
              "identifier": "com.tekyida.ios.source",
              "apps": [
                {
                  "bundleIdentifier": "com.tekyida.app",
                  "name": "Tekyida",
                  "developerName": "Tekyida",
                  "localizedDescription": "Modern IOU Tracker for iOS & Android",
                  "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/ios/Sources/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                  "versions": [
                    {
                      "version": "1.0",
                      "buildVersion": "${{ github.run_number }}",
                      "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                      "minOSVersion": "17.0",
                      "localizedDescription": "Automated build from commit ${{ github.sha }}",
                      "downloadURL": "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/Tekyida.ipa",
                      "size": 0
                    }
                  ]
                }
              ]
            }
          EOF
          fi

          # 2. Setup Android F-Droid repo
          if [ -f release-assets/Tekyida.apk ]; then
            cp release-assets/Tekyida.apk site-pages/fdroid/repo/Tekyida.apk
          fi
          cp distribution/fdroid/config.yml site-pages/fdroid/config.yml
          cp distribution/fdroid/keystore.p12 site-pages/fdroid/keystore.p12
          cp distribution/fdroid/icon.png site-pages/fdroid/repo/icon.png
          cp distribution/fdroid/metadata/com.tekyida.yml site-pages/fdroid/metadata/

          # 3. Generate signed F-Droid repository indexes
          cd site-pages/fdroid
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$HOME/.local/bin:$PATH"
          fdroid update --create-metadata --pretty
          cd ../..

          # 4. Clean sensitive signing files before deploying to public GitHub Pages
          rm -f site-pages/fdroid/keystore.p12 site-pages/fdroid/config.yml

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
