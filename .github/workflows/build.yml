name: Build Mobile Apps (iOS & Android)

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

# Cancel in-progress runs on the same branch to conserve macOS minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Quality Gate & Change Detection
  # - Detects changed paths per platform (Web, Android, iOS, Distribution)
  # - Web & Backend tests run here in Quality Gate (100% coverage on main; skipped on other branches)
  # - Android and iOS tests DO NOT run here (they run inside their respective build jobs on main)
  # -------------------------------------------------------------
  quality-gate:
    name: Quality Gate & Change Detection
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      android: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ios == 'true' }}
      mobile: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.android == 'true' || steps.filter.outputs.ios == 'true' || steps.filter.outputs.distribution == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true' }}
      is_main: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Changed Paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # Limit push detection to commits in this push; dispatch uses the current SHA.
          base: ${{ github.event.before || github.sha }}
          filters: |
            backend:
              - 'backend/**'
              - 'package*.json'
            frontend:
              - 'frontend/**'
              - 'package*.json'
            android:
              - 'android/**'
              - 'distribution/**'
              - 'package*.json'
            ios:
              - 'ios/**'
              - 'distribution/**'
              - 'package*.json'
            distribution:
              - 'distribution/**'

      - name: Fast-Track Notice for Feature/Beta Branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "⚡ Fast-track change detection for branch '${{ github.ref_name }}':"
          echo "  - Backend changed:     ${{ steps.filter.outputs.backend }}"
          echo "  - Frontend changed:    ${{ steps.filter.outputs.frontend }}"
          echo "  - Android changed:     ${{ steps.filter.outputs.android }}"
          echo "  - iOS changed:         ${{ steps.filter.outputs.ios }}"
          echo "  - Distribution changed:${{ steps.filter.outputs.distribution }}"
          echo "Unit tests are skipped on non-main branches for fast delivery."

      - name: Set up Node.js runtime
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup npm cache for quality checks
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: qg-npm-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}

      - name: Install Quality Gate Dependencies
        if: github.ref == 'refs/heads/main'
        run: |
          [ "${{ steps.filter.outputs.backend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && npm ci --prefix backend --prefer-offline || true
          [ "${{ steps.filter.outputs.frontend }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] && npm ci --prefix frontend --prefer-offline || true

      # On main branch: complete quality gate (100% coverage vitest, jscpd, SAST audit)
      # Unit tests are skipped on non-main branches
      - name: Run Tekyida Strict Quality Gate (tests/run.sh)
        if: github.ref == 'refs/heads/main'
        env:
          CHANGE_BACKEND: ${{ steps.filter.outputs.backend }}
          CHANGE_FRONTEND: ${{ steps.filter.outputs.frontend }}
          CHANGE_ANDROID: ${{ steps.filter.outputs.android }}
          CHANGE_IOS: ${{ steps.filter.outputs.ios }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          chmod +x tests/run.sh
          ./tests/run.sh

  # -------------------------------------------------------------
  # Job 2: Initialize GitHub Release (Stable or Beta Pre-release)
  # Carries forward previous assets so unchanged platforms keep their last build
  # -------------------------------------------------------------
  init-release:
    name: Initialize Release & Carry Forward Assets
    needs: [ quality-gate ]
    if: github.event_name != 'pull_request' && needs.quality-gate.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release-setup.outputs.release_tag }}
      is_beta: ${{ steps.release-setup.outputs.is_beta }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create or Update GitHub Release
        id: release-setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            RELEASE_TAG="build-${{ github.run_number }}"
            IS_BETA="false"
            PRERELEASE_FLAG=""
            RELEASE_TITLE="Build ${{ github.run_number }}"
          else
            RELEASE_TAG="beta-${{ github.run_number }}"
            IS_BETA="true"
            PRERELEASE_FLAG="--prerelease"
            RELEASE_TITLE="Build ${{ github.run_number }} Beta (${{ github.ref_name }})"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "is_beta=$IS_BETA" >> "$GITHUB_OUTPUT"

          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --title "$RELEASE_TITLE" \
              $PRERELEASE_FLAG \
              --generate-notes
          fi

          # Carry forward previous release assets:
          # On Beta: picks the most recent Beta pre-release (or fallback to latest release)
          # On Main: picks the most recent Stable release
          if [ "$IS_BETA" = "true" ]; then
            PREV_TAG=$(gh release list --repo "${{ github.repository }}" --limit 10 --json tagName,isPrerelease -q '.[] | select(.isPrerelease == true) | .tagName' 2>/dev/null | grep -v "$RELEASE_TAG" | head -n 1 || true)
            [ -z "$PREV_TAG" ] && PREV_TAG=$(gh release list --repo "${{ github.repository }}" --limit 4 --json tagName -q '.[].tagName' 2>/dev/null | grep -v "$RELEASE_TAG" | head -n 1 || true)
          else
            PREV_TAG=$(gh release list --repo "${{ github.repository }}" --exclude-pre-releases --limit 4 --json tagName -q '.[].tagName' 2>/dev/null | grep -v "$RELEASE_TAG" | head -n 1 || true)
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "Carrying forward assets from previous release: $PREV_TAG"
            mkdir -p previous-assets
            gh release download "$PREV_TAG" --repo "${{ github.repository }}" --pattern "Tekyida.*" --pattern "apps*.json" --dir previous-assets || true
            if ls previous-assets/* >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" \
                --repo "${{ github.repository }}" \
                previous-assets/* \
                --clobber || true
            fi
          fi

  # -------------------------------------------------------------
  # Job 3: iOS Build (SwiftUI, XcodeGen, Unsigned IPA)
  # Only runs if iOS files changed (skips tests and build if unchanged)
  # -------------------------------------------------------------
  build-ios:
    name: Build & Package iOS IPA
    needs: [ quality-gate, init-release ]
    if: |
      always() &&
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.ios == 'true' &&
      (needs.init-release.result == 'success' || needs.init-release.result == 'skipped')
    runs-on: macos-15

    permissions:
      contents: write

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Stamps the CI run number into CFBundleVersion so each build shows a distinct version
      - name: Stamp Build Number
        run: plutil -replace CFBundleVersion -string "${{ github.run_number }}" Sources/App/Info.plist

      # Native Liquid Glass (Tab API, .glass buttons, glassEffect) only compiles with
      # the iOS 26 SDK / Swift 6.2 compiler; select the newest Xcode on the runner image
      - name: Select Newest Xcode
        run: |
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $NEWEST_XCODE"
          sudo xcode-select -s "$NEWEST_XCODE"
          xcodebuild -version
          MAJOR=$(basename "$NEWEST_XCODE" | grep -oE '[0-9]+' | head -1)
          if [ "${MAJOR:-0}" -lt 26 ]; then
            echo "::warning::Runner only has Xcode $MAJOR; the native Liquid Glass code paths (iOS 26 SDK / Swift 6.2) will be compiled out. Use a runner image that ships Xcode 26+."
          fi

      # Purely informational: logs which Xcode version compiled the app
      - name: Show Xcode Version
        run: xcodebuild -version

      # Caches Homebrew downloads to avoid re-downloading bottles on macOS
      - name: Cache Homebrew Downloads
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-xcodegen-${{ hashFiles('ios/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-

      # Installs XcodeGen, which converts project.yml into a real .xcodeproj file.
      - name: Install XcodeGen
        run: brew install xcodegen

      # Generates Tekyida.xcodeproj from project.yml.
      - name: Generate Xcode Project
        run: xcodegen generate

      # Caches Xcode DerivedData for faster simulator test & build times
      - name: Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('ios/project.yml', 'ios/Sources/**', 'ios/Tests/**') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      # Prepares the CoreSimulator daemon and identifies a concrete simulator destination ID (only needed for tests on main)
      - name: Prepare iOS Simulator
        if: github.ref == 'refs/heads/main'
        run: |
          xcrun simctl list devices available
          SIM_ID=$(xcrun simctl list devices available | grep -i "iPhone" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -n 1 || true)
          if [ -z "$SIM_ID" ]; then
            echo "No existing iPhone simulator found, attempting to create one..."
            SIM_ID=$(xcrun simctl create "CI-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" || true)
          fi
          echo "Selected simulator ID: $SIM_ID"
          if [ -n "$SIM_ID" ]; then
            xcrun simctl boot "$SIM_ID" || true
            echo "SIMULATOR_DESTINATION=id=$SIM_ID" >> "$GITHUB_ENV"
          else
            echo "SIMULATOR_DESTINATION=platform=iOS Simulator,name=iPhone 16" >> "$GITHUB_ENV"
          fi

      # iOS Tests run here inside the iOS job:
      # On main branch: Full suite (Unit Tests AND UI Automation Tests)
      # Unit tests are skipped on other branches
      - name: Run iOS Full Unit & UI E2E Tests (Simulator - Main Branch)
        if: github.ref == 'refs/heads/main'
        run: |
          xcodebuild test \
            -project Tekyida.xcodeproj \
            -scheme Tekyida \
            -destination "${SIMULATOR_DESTINATION}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Compiles the app into an .xcarchive without code signing.
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Tekyida.xcodeproj \
            -scheme Tekyida \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tekyida.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Creates the unsigned .ipa file by packaging the compiled .app into Payload/
      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Tekyida.xcarchive/Products/Applications/Tekyida.app build/Payload/
          cd build && zip -r Tekyida.ipa Payload

      # Generates apps.json for SideStore / LiveContainer
      - name: Generate SideStore Source JSON
        run: |
          mkdir -p build
          RELEASE_TAG="${{ needs.init-release.outputs.release_tag }}"
          IS_BETA="${{ needs.init-release.outputs.is_beta }}"
          VERSION_STR=$(plutil -extract CFBundleShortVersionString raw Sources/App/Info.plist 2>/dev/null || echo "1.0")

          if [ "$IS_BETA" = "true" ]; then
            FEED_NAME="Tekyida (Beta)"
            FEED_ID="com.tekyida.ios.source.beta"
            VERSION_DESC="Beta build from branch ${{ github.ref_name }} (commit ${{ github.sha }})"
          else
            FEED_NAME="Tekyida (Stable)"
            FEED_ID="com.tekyida.ios.source"
            VERSION_DESC="Automated build from commit ${{ github.sha }}"
          fi

          cat <<EOF > build/apps.json
          {
            "name": "$FEED_NAME",
            "identifier": "$FEED_ID",
            "apps": [
              {
                "bundleIdentifier": "com.tekyida.app",
                "name": "Tekyida",
                "developerName": "Tekyida",
                "localizedDescription": "Modern IOU Tracker for iOS & Android",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/distribution/fdroid/icon.png",
                "versions": [
                  {
                    "version": "$VERSION_STR",
                    "buildVersion": "${{ github.run_number }}",
                    "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "minOSVersion": "17.0",
                    "localizedDescription": "$VERSION_DESC",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Tekyida.ipa",
                    "size": $(stat -f%z build/Tekyida.ipa)
                  }
                ]
              }
            ]
          }
          EOF

      # Directly uploads IPA and apps.json to GitHub Release
      - name: Upload iOS Assets Directly to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.init-release.outputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            build/Tekyida.ipa \
            build/apps.json \
            --clobber

  # -------------------------------------------------------------
  # Job 4: Android Build (Kotlin, Jetpack Compose, Release APK)
  # Only runs if Android files changed (skips tests and build if unchanged)
  # -------------------------------------------------------------
  build-android:
    name: Build & Package Android APK
    needs: [ quality-gate, init-release ]
    if: |
      always() &&
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.android == 'true' &&
      (needs.init-release.result == 'success' || needs.init-release.result == 'skipped')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Sets up Java JDK 17 for Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Sets up Gradle with caching for fast incremental builds
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      # Android Tests run here inside the Android job:
      # Runs Android Unit Tests only on main branch (skipped on other branches)
      - name: Run Android Unit Tests
        if: github.ref == 'refs/heads/main'
        run: ./gradlew testReleaseUnitTest --no-daemon

      # Builds the release APK with dynamic versionCode matching CI
      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon -x lint

      # Renames to Tekyida.apk for standard naming
      - name: Prepare APK Asset
        run: |
          mkdir -p build-assets
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-assets/Tekyida.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-release.apk build-assets/Tekyida.apk

      # Directly uploads APK to GitHub Release
      - name: Upload Android Assets Directly to GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.init-release.outputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            build-assets/Tekyida.apk \
            --clobber

  # -------------------------------------------------------------
  # Job 5: Web Build, E2E & DAST Dynamic Security Verification
  # (Only runs on 'main' branch when web/backend files change)
  # -------------------------------------------------------------
  build-web:
    name: Build & Verify Web (E2E & DAST)
    needs: [ quality-gate ]
    if: |
      always() &&
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js runtime for web
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Web npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: web-npm-${{ runner.os }}-${{ hashFiles('backend/package-lock.json', 'frontend/package-lock.json') }}

      - name: Install Web Packages
        run: |
          npm ci --prefix backend --prefer-offline
          npm ci --prefix frontend --prefer-offline

      - name: Cache Next.js Build Cache
        uses: actions/cache@v5
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json', 'frontend/app/**', 'frontend/components/**', 'frontend/lib/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Cache Playwright Browser Binaries
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          npx --prefix frontend playwright install --with-deps chromium

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          npx --prefix frontend playwright install-deps chromium

      - name: Build Next.js Production Web App
        env:
          NEXT_PUBLIC_CONVEX_URL: https://tekyida-convex-api.codecy.dev
          NEXT_PUBLIC_CONVEX_SITE_URL: https://tekyida-convex-site.codecy.dev
        run: |
          npm run build --prefix frontend

      - name: Run Web E2E & DAST Security Suite
        env:
          NEXT_PUBLIC_CONVEX_URL: https://tekyida-convex-api.codecy.dev
          NEXT_PUBLIC_CONVEX_SITE_URL: https://tekyida-convex-site.codecy.dev
        run: |
          npm run test:e2e --prefix frontend

  # -------------------------------------------------------------
  # Job 6: Deploy Mobile Distribution Portal & Repositories (GitHub Pages)
  # Provides dual channels: Stable and Beta for both SideStore & F-Droid
  # -------------------------------------------------------------
  deploy-distribution:
    name: Deploy Mobile Distribution (SideStore & F-Droid)
    needs: [ quality-gate, init-release, build-ios, build-android ]
    if: |
      always() &&
      !cancelled() &&
      needs.quality-gate.result == 'success' &&
      needs.quality-gate.outputs.mobile == 'true' &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped') &&
      (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Sets up Java JDK 17 for keytool and F-Droid index signing
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Installs F-Droid server via pipx for accurate Android resources parsing
      - name: Install F-Droid Server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apksigner pipx
          pipx install fdroidserver
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Builds the dual-channel static GitHub Pages distribution site
      - name: Assemble Mobile Distribution Site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site-pages/ios site-pages/ios/beta
          mkdir -p site-pages/fdroid/repo site-pages/fdroid/metadata
          mkdir -p site-pages/fdroid/beta/repo site-pages/fdroid/beta/metadata

          cp distribution/portal/index.html site-pages/index.html

          # 1. Identify current and latest releases
          CURRENT_TAG="${{ needs.init-release.outputs.release_tag }}"
          IS_CURRENT_BETA="${{ needs.init-release.outputs.is_beta }}"

          LATEST_STABLE_TAG=$(gh release list --repo "${{ github.repository }}" --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          LATEST_BETA_TAG=$(gh release list --repo "${{ github.repository }}" --limit 10 --json tagName,isPrerelease -q '.[] | select(.isPrerelease == true) | .tagName' 2>/dev/null | head -n 1 || true)

          if [ "$IS_CURRENT_BETA" = "true" ]; then
            LATEST_BETA_TAG="$CURRENT_TAG"
          else
            LATEST_STABLE_TAG="$CURRENT_TAG"
          fi

          echo "Target Stable Tag: $LATEST_STABLE_TAG"
          echo "Target Beta Tag:   $LATEST_BETA_TAG"

          mkdir -p assets-stable assets-beta
          if [ -n "$LATEST_STABLE_TAG" ]; then
            gh release download "$LATEST_STABLE_TAG" --repo "${{ github.repository }}" --pattern "Tekyida.*" --pattern "apps*.json" --dir assets-stable || true
          fi
          if [ -n "$LATEST_BETA_TAG" ]; then
            gh release download "$LATEST_BETA_TAG" --repo "${{ github.repository }}" --pattern "Tekyida.*" --pattern "apps*.json" --dir assets-beta || true
          fi

          # Fallback between channels if one channel has not produced assets yet
          if [ ! -f assets-beta/Tekyida.apk ] && [ -f assets-stable/Tekyida.apk ]; then
            cp assets-stable/Tekyida.apk assets-beta/Tekyida.apk
          elif [ ! -f assets-stable/Tekyida.apk ] && [ -f assets-beta/Tekyida.apk ]; then
            cp assets-beta/Tekyida.apk assets-stable/Tekyida.apk
          fi

          # 2. Setup iOS SideStore source feeds (Strict Normalization for Stable & Beta)
          if [ -f assets-stable/apps.json ]; then
            cp assets-stable/apps.json site-pages/ios/apps.json
          fi
          if [ -f assets-beta/apps.json ]; then
            cp assets-beta/apps.json site-pages/ios/beta/apps.json
          fi
          python3 distribution/sidestore/format_sources.py "${{ github.repository }}" "${{ github.run_number }}" "$LATEST_STABLE_TAG" "$LATEST_BETA_TAG" 

          # 3. Setup Android F-Droid: STABLE Channel
          # Place APK into repo/ and app icon into metadata/ (NEVER put icon.png into repo/)
          if [ -f assets-stable/Tekyida.apk ]; then
            cp assets-stable/Tekyida.apk site-pages/fdroid/repo/Tekyida.apk
          fi
          cp distribution/fdroid/config.yml site-pages/fdroid/config.yml
          cp distribution/fdroid/keystore.p12 site-pages/fdroid/keystore.p12
          cp distribution/fdroid/icon.png site-pages/fdroid/icon.png
          cp -r distribution/fdroid/metadata/* site-pages/fdroid/metadata/

          cd site-pages/fdroid
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$HOME/.local/bin:$PATH"
          fdroid update --create-metadata --pretty
          cd ../..

          # 4. Setup Android F-Droid: BETA Channel
          if [ -f assets-beta/Tekyida.apk ]; then
            cp assets-beta/Tekyida.apk site-pages/fdroid/beta/repo/Tekyida.apk
          fi
          cp distribution/fdroid/config-beta.yml site-pages/fdroid/beta/config.yml
          cp distribution/fdroid/keystore-beta.p12 site-pages/fdroid/beta/keystore-beta.p12
          cp distribution/fdroid/icon.png site-pages/fdroid/beta/icon.png
          cp -r distribution/fdroid/metadata/* site-pages/fdroid/beta/metadata/

          cd site-pages/fdroid/beta
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$HOME/.local/bin:$PATH"
          fdroid update --create-metadata --pretty
          cd ../../..

          # 5. Security Clean-up: remove sensitive keystore and config before deployment
          rm -f site-pages/fdroid/keystore.p12 site-pages/fdroid/config.yml
          rm -f site-pages/fdroid/beta/keystore-beta.p12 site-pages/fdroid/beta/config-beta.yml

      # Clean up any existing github-pages artifact from previous attempts of this run to prevent duplicates on rerun
      - name: Clean up existing Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING_ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts -q ".artifacts[] | select(.name == \"github-pages\") | .id" 2>/dev/null || true)
          for ARTIFACT_ID in $EXISTING_ARTIFACTS; do
            echo "Deleting prior github-pages artifact ID: $ARTIFACT_ID"
            gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID || true
          done

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-pages/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
