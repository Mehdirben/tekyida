# Workflow to build and package both iOS (Unsigned IPA) and Android (APK) applications
name: Build Mobile Apps (iOS & Android)

# Events that trigger this workflow to run
on:
  push:
    # Rebuild the apps on every push to the main/master branch
    branches: [ main, master ]
  pull_request:
    # Also build PRs targeting main/master, so breakage is caught before merging
    branches: [ main, master ]
  # Adds a "Run workflow" button in the Actions tab for manual builds
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: iOS Build (SwiftUI, XcodeGen, Unsigned IPA)
  # -------------------------------------------------------------
  build-ios:
    name: Build & Package iOS IPA
    # GitHub's free hosted macOS runner — required because only macOS/Xcode can build iOS apps
    runs-on: macos-15

    defaults:
      run:
        working-directory: ios

    steps:
      # Downloads this repository's code into the runner's workspace
      - name: Checkout repository
        uses: actions/checkout@v5

      # Stamps the CI run number into CFBundleVersion so each build shows a
      # distinct version inside LiveContainer (easy to confirm an update landed)
      - name: Stamp Build Number
        run: plutil -replace CFBundleVersion -string "${{ github.run_number }}" Sources/App/Info.plist

      # Purely informational: logs which Xcode version compiled the app
      - name: Show Xcode Version
        run: xcodebuild -version

      # Installs XcodeGen, which converts project.yml into a real .xcodeproj file.
      # This keeps the repo free of generated, merge-conflict-prone Xcode project files.
      - name: Install XcodeGen
        run: brew install xcodegen

      # Generates Tekyida.xcodeproj from project.yml.
      # Any new .swift file added under Sources/App/ is picked up automatically at this step.
      - name: Generate Xcode Project
        run: xcodegen generate

      # Compiles an optimized Release build for physical iPhones into an .xcarchive.
      # The CODE_SIGNING_* flags disable code signing: CI has no Apple certificates,
      # so the app is built UNSIGNED — a sideloading tool (Impactor/Sideloadly/LiveContainer)
      # signs it later with your personal Apple ID at install time.
      - name: Build Archive
        run: |
          xcodebuild archive \
            -project Tekyida.xcodeproj \
            -scheme Tekyida \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Tekyida.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Wraps the compiled app into an IPA — the format iPhones install.
      # An IPA is simply a zip archive containing a Payload/ folder with the .app bundle inside.
      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Tekyida.xcarchive/Products/Applications/Tekyida.app build/Payload/
          cd build
          zip -r -q Tekyida.ipa Payload

      # Generates an AltStore-format source (apps.json) describing this build for LiveContainer.
      - name: Generate LiveContainer Source JSON
        run: |
          cat > build/apps.json <<EOF
          {
            "name": "Tekyida Apps",
            "identifier": "com.tekyida.ios.source",
            "apps": [
              {
                "bundleIdentifier": "com.tekyida.app",
                "name": "Tekyida",
                "developerName": "Tekyida",
                "localizedDescription": "Modern IOU Tracker for iOS & Android",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/main/ios/Sources/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png",
                "versions": [
                  {
                    "version": "1.0",
                    "buildVersion": "${{ github.run_number }}",
                    "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                    "minOSVersion": "17.0",
                    "localizedDescription": "Automated build from commit ${{ github.sha }}",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_number }}/Tekyida.ipa",
                    "size": $(stat -f%z build/Tekyida.ipa)
                  }
                ]
              }
            ]
          }
          EOF

      # Publishes the IPA as a downloadable artifact on the workflow run page
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Tekyida-unsigned-ipa
          path: ios/build/Tekyida.ipa
          retention-days: 14

      # Publishes apps.json for LiveContainer integration
      - name: Upload LiveContainer Source Artifact
        uses: actions/upload-artifact@v6
        with:
          name: livecontainer-source
          path: ios/build/apps.json
          retention-days: 14

  # -------------------------------------------------------------
  # Job 2: Android Build (Kotlin, Jetpack Compose, Release APK)
  # -------------------------------------------------------------
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Sets up Java JDK 17 for Android Gradle Plugin
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Sets up Gradle with caching for fast incremental builds
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Compiles the Android application release APK
      - name: Build Android Release APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      # Renames and stages the APK file for artifacts & releases
      - name: Stage Android APK
        run: |
          mkdir -p build
          cp app/build/outputs/apk/release/app-release.apk build/Tekyida.apk

      # Publishes the APK as a downloadable artifact on the workflow run page
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Tekyida-android-apk
          path: android/build/Tekyida.apk
          retention-days: 14

  # -------------------------------------------------------------
  # Job 3: Publish Unified GitHub Release (iOS IPA + Android APK)
  # -------------------------------------------------------------
  release:
    name: Publish Release Assets
    needs: [ build-ios, build-android ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v6
        with:
          name: Tekyida-unsigned-ipa
          path: release-assets

      - name: Download LiveContainer Source Artifact
        uses: actions/download-artifact@v6
        with:
          name: livecontainer-source
          path: release-assets

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v6
        with:
          name: Tekyida-android-apk
          path: release-assets

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            release-assets/Tekyida.ipa \
            release-assets/apps.json \
            release-assets/Tekyida.apk \
            --title "Build ${{ github.run_number }}" \
            --generate-notes
